<!doctype html><html><head><meta charset="utf-8"><title>MNIST architecture review</title><style>
    *{box-sizing:border-box}body{margin:0;background:#e8edf3;color:#172033;font:15px system-ui}header{position:sticky;top:0;z-index:3;background:#101d33;color:white;padding:17px 25px;display:flex;align-items:center;gap:18px;box-shadow:0 2px 10px #0003}h1{font-size:19px;margin:0;margin-right:auto}select,button,a{font:inherit;padding:8px 12px;border-radius:6px;border:0}button,select{cursor:pointer}header a{color:#c7ddff;text-decoration:none}#sheet{padding:24px;overflow:auto;height:calc(100vh - 74px)}img{display:block;background:white;box-shadow:0 3px 18px #2332;width:100%;height:auto;margin:auto}.hint{font-size:13px;color:#b6c4d9}</style></head><body><header><h1>MNIST accelerator · review copy</h1><select id="page"><option value="01">01 · System datapath</option><option value="02">02 · Top control</option><option value="03">03 · Top FSM</option><option value="04">04 · FC layer</option><option value="05">05 · FC FSM</option><option value="06">06 · MAC lane</option><option value="07">07 · Requant + ReLU</option><option value="08">08 · Timing &amp; mapping</option></select><button onclick="zoom(-.2)">−</button><button onclick="fit()">Fit</button><button onclick="zoom(.2)">+</button><a href="MNIST accelerator — reviewed.drawio" download>Editable draw.io</a></header><main id="sheet"><img id="diagram" src="previews/01.svg"></main><script>let scale=1;let el=document.getElementById('diagram');document.getElementById('page').onchange=e=>{el.src='previews/'+e.target.value+'.svg';fit()};function zoom(d){scale=Math.max(.4,Math.min(3,scale+d));el.style.width=(scale*100)+'%';el.style.maxWidth='none'}function fit(){scale=1;el.style.width='100%'}document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){let s=document.getElementById('page');s.selectedIndex=Math.max(0,Math.min(7,s.selectedIndex+(e.key==='ArrowRight'?1:-1)));s.onchange({target:s})}})</script></body></html>
