<text x="1708" y="211" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#334155" xml:space="preserve">FC1 source latency = image ROM (1).</text>
<text x="1708" y="234" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#334155" xml:space="preserve">FC2 source latency = delay FF (1).</text>
<text x="1708" y="257" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#334155" xml:space="preserve">Each MAC adds its activation FF (1).</text>
