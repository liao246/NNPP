<text x="498" y="1126" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#334155" xml:space="preserve">argmax_digit feeds both pred_digit capture and the label comparator; both capture on argmax_valid.</text>
<text x="498" y="1149" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#334155" xml:space="preserve">acc2 also feeds score_debug through wiring only. Named control nets connect to the controller on page 02.</text>
