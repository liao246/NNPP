<rect x="90" y="970" width="965" height="175" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="108" y="996" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">State and output contract</text>
<path d="M106 1007 H1039" stroke="#94a3b8" stroke-opacity="0.28"/>
<text x="108" y="1026" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#334155" xml:space="preserve">state / next_state: 4 bits. All six outputs are listed in every state.</text>
<text x="108" y="1049" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#334155" xml:space="preserve">start is an input; it is accepted only in IDLE or DONE.</text>
<text x="108" y="1072" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#334155" xml:space="preserve">Unrecognized state: next_state = IDLE, outputs = 0.</text>
<text x="108" y="1095" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#334155" xml:space="preserve">Each *_START unconditionally advances on the next rising edge.</text>
<rect x="1160" y="970" width="935" height="175" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="1178" y="996" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">Result contract</text>
<path d="M1176 1007 H2079" stroke="#94a3b8" stroke-opacity="0.28"/>
<text x="1178" y="1026" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#334155" xml:space="preserve">argmax_valid and argmax_digit are aligned.</text>
<text x="1178" y="1049" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#334155" xml:space="preserve">The edge leaving ARGMAX_WAIT captures pred_digit and correct.</text>
<text x="1178" y="1072" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#334155" xml:space="preserve">After that edge: done=1, busy=0, final cycle_count holds.</text>
<text x="1178" y="1095" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#334155" xml:space="preserve">In DONE, start goes directly to FC1_START; no extra button press.</text>
