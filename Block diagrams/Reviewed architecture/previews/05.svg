<text x="98" y="1116" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">Count meaning</text>
<path d="M96 1127 H1034" stroke="#94a3b8" stroke-opacity="0.28"/>
<text x="98" y="1146" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#334155" xml:space="preserve">CLEAR → FILL_0 sets q=0. FILL_0: q=0; FILL_1: q=1.</text>
<text x="98" y="1169" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#334155" xml:space="preserve">ACCUMULATE: q=2…N_IN+1; exactly N_IN products commit.</text>
<text x="98" y="1192" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#334155" xml:space="preserve">weights_done = (q == N_IN+1). Address i=min(q,N_IN−1).</text>
<rect x="1140" y="1090" width="980" height="130" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="1158" y="1116" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">Batch meaning</text>
<path d="M1156 1127 H2104" stroke="#94a3b8" stroke-opacity="0.28"/>
<text x="1158" y="1146" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#334155" xml:space="preserve">batches_done = (batch == B−1). CAPTURE uses current batch.</text>
<text x="1158" y="1169" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#334155" xml:space="preserve">The capture edge increments batch only if another batch remains.</text>
<text x="1158" y="1192" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#334155" xml:space="preserve">DONE is one cycle, then IDLE resets batch for the next invocation.</text>
