<text x="458" y="238" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#334155" xml:space="preserve">weight_addr_r [WW]</text>
<text x="458" y="262" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#334155" xml:space="preserve">1 cycle; reset = 0</text>
<path d="M440 303 l13 9 l-13 9" fill="none" stroke="#7c3aed" stroke-width="2"/>
<rect x="840" y="155" width="360" height="190" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="858" y="187" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#0f172a">Local weight ROM</text>
<path d="M856 201 H1184" stroke="#059669" stroke-opacity="0.28"/>
<text x="858" y="223" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#334155" xml:space="preserve">B × N_IN entries × signed 8</text>
<text x="858" y="247" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#334155" xml:space="preserve">weight_data = ROM[weight_addr_r]</text>
<text x="858" y="271" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#334155" xml:space="preserve">Synchronous read: 1 cycle</text>
<text x="858" y="295" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#334155" xml:space="preserve">Lane-specific initialization file</text>
<path d="M840 318 l13 9 l-13 9" fill="none" stroke="#059669" stroke-width="2"/>
<rect x="70" y="490" width="220" height="100" rx="10" fill="#ffffff" stroke="#475569" stroke-width="2"/>
<text x="88" y="522" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#0f172a">act_data</text>
<path d="M86 536 H274" stroke="#475569" stroke-opacity="0.28"/>
<text x="88" y="558" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#334155" xml:space="preserve">[9], zero-extended</text>
<rect x="440" y="450" width="280" height="180" rx="10" fill="#f3efff" stroke="#7c3aed" stroke-width="2"/>
<text x="458" y="482" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#0f172a">Activation FF</text>
<path d="M456 496 H704" stroke="#7c3aed" stroke-opacity="0.28"/>
<text x="458" y="518" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#334155" xml:space="preserve">act_data_r [signed 9]</text>
<text x="458" y="542" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#334155" xml:space="preserve">Range 0…255 (FC1)</text>
<text x="458" y="566" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#334155" xml:space="preserve">Range 0…127 (FC2)</text>
<text x="458" y="590" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#334155" xml:space="preserve">1 cycle; reset = 0</text>
<path d="M440 603 l13 9 l-13 9" fill="none" stroke="#7c3aed" stroke-width="2"/>
<rect x="70" y="820" width="220" height="100" rx="10" fill="#ffffff" stroke="#475569" stroke-width="2"/>
<text x="88" y="852" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#0f172a">bias_addr</text>
<path d="M86 866 H274" stroke="#475569" stroke-opacity="0.28"/>
<text x="88" y="888" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#334155" xml:space="preserve">batch [BW]</text>
<rect x="440" y="780" width="370" height="180" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="458" y="812" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#0f172a">Bias selector / LUT ROM</text>
<path d="M456 826 H794" stroke="#059669" stroke-opacity="0.28"/>
<text x="458" y="848" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#334155" xml:space="preserve">bias_in = bias_rom[bias_addr]</text>
<text x="458" y="872" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#334155" xml:space="preserve">B entries × signed 32</text>
<text x="458" y="896" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#334155" xml:space="preserve">Combinational; no clock</text>
<text x="458" y="920" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#334155" xml:space="preserve">Lane-specific initialization file</text>
<rect x="1060" y="470" width="560" height="320" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="1078" y="502" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#0f172a">Accumulator next-value logic</text>
<path d="M1076 516 H1604" stroke="#2563eb" stroke-opacity="0.28"/>
<text x="1078" y="538" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#334155" xml:space="preserve">if acc_clear:</text>
<text x="1078" y="561" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#334155" xml:space="preserve">  next_acc = bias_in</text>
<text x="1078" y="584" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#334155" xml:space="preserve">else if acc_en:</text>
<text x="1078" y="607" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#334155" xml:space="preserve">  product = signed(weight_data) × signed(act_data_r)</text>
<text x="1078" y="630" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#334155" xml:space="preserve">  next_acc = acc_out + sign_extend(product)</text>
<text x="1078" y="653" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#334155" xml:space="preserve">else: next_acc = acc_out</text>
<text x="1078" y="676" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#334155" xml:space="preserve">Product: signed 17 → signed 32</text>
<rect x="1780" y="530" width="240" height="180" rx="10" fill="#f3efff" stroke="#7c3aed" stroke-width="2"/>
<text x="1798" y="562" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#0f172a">Accumulator FF</text>
<path d="M1796 576 H2004" stroke="#7c3aed" stroke-opacity="0.28"/>
<text x="1798" y="598" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#334155" xml:space="preserve">acc_out [signed 32]</text>
<text x="1798" y="622" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#334155" xml:space="preserve">reset = 0</text>
<path d="M1780 683 l13 9 l-13 9" fill="none" stroke="#7c3aed" stroke-width="2"/>
<rect x="70" y="1090" width="960" height="135" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="88" y="1116" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">Memory layout for lane L</text>
<path d="M86 1127 H1014" stroke="#94a3b8" stroke-opacity="0.28"/>
<text x="88" y="1146" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#334155" xml:space="preserve">n = L × B + batch; weight_rom[batch×N_IN + i] = W[n][i].</text>
<text x="88" y="1169" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#334155" xml:space="preserve">bias_rom[batch] = bias[n]. Invalid n: initialize weight/bias entries to zero.</text>
<text x="88" y="1192" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#334155" xml:space="preserve">FC1: depth=784, WW=10, BW=2. FC2: depth=64, WW=6, BW=1.</text>
<rect x="1130" y="1090" width="920" height="135" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="1148" y="1116" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">Operand timing contract</text>
<path d="M1146 1127 H2034" stroke="#94a3b8" stroke-opacity="0.28"/>
<text x="1148" y="1146" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#334155" xml:space="preserve">External activation source is registered (1 cycle), then act_data_r (1).</text>
<text x="1148" y="1169" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#334155" xml:space="preserve">Weight address buffer (1 cycle), then registered weight ROM read (1).</text>
<text x="1148" y="1192" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#334155" xml:space="preserve">acc_en is low during the two fill cycles; controls are not delayed here.</text>
