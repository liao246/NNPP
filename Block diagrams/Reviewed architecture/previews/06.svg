<text x="890" y="521" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#475569">act_data_r [signed 9]</text>
<rect x="892.1" y="876" width="165.79999999999998" height="23" rx="4" fill="white"/>
<text x="975" y="893" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#475569">bias_in [signed 32]</text>
<rect x="1637.6" y="583" width="124.79999999999998" height="23" rx="4" fill="white"/>
<text x="1700" y="600" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#475569">next_acc [s32]</text>
