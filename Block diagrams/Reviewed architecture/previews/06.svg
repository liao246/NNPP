<text x="1670" y="925" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#475569">acc_out [signed 32] · feedback</text>
<text x="50" y="43" font-family="Segoe UI,Arial,sans-serif" font-size="30" fill="#0f172a" font-weight="700">One MAC lane</text>
<text x="50" y="82" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#475569" font-weight="400">Bias load → signed multiply-accumulate → held accumulator  •  common broadcast addresses</text>
<text x="50" y="1282" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#64748b" font-weight="400">MNIST / 196 → 64 → 10  •  REVIEW COPY  •  All sequential blocks: common clk [1], synchronous rst [1] (reset wires omitted).</text>
<text x="1760" y="1282" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#64748b" font-weight="400">06 · MAC lane</text>
<text x="1078" y="448" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#c2410c" font-weight="400">acc_clear [1], acc_en [1] →</text>
<text x="1840" y="750" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#2563eb" font-weight="400">→ mac_lane_out[L]</text>
